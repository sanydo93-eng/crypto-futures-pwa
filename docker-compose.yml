services:
  signals:
    build: .
    image: crypto-futures-signals:latest
    container_name: crypto-futures-signals
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - signals-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  signals-data:
