<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сигналы: теннис и футбол</title>
<meta name="theme-color" content="#0f1720">
<meta name="description" content="Модели точного счёта в теннисе и гола в первом тайме в футболе">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="top__row">
    <h1 class="top__title">Сигналы</h1>
    <button id="refresh" class="button" type="button">Обновить</button>
  </div>
  <p class="top__meta">
    <span id="provider" class="badge">—</span>
    <span id="updated" class="muted">загрузка…</span>
  </p>
  <nav class="tabs" role="tablist">
    <button class="tab tab--active" data-tab="tennis" role="tab">Теннис</button>
    <button class="tab" data-tab="football" role="tab">Футбол</button>
    <button class="tab" data-tab="stats" role="tab">Статистика</button>
  </nav>
</header>

<div id="banner" class="banner" hidden></div>

<nav class="filters" id="filters" aria-label="Фильтры">
  <label class="filter">
    <input type="checkbox" id="only-signals" checked>
    <span>Только сигналы</span>
  </label>
  <label class="filter filter--range">
    <span>Порог <output id="edge-value">5%</output></span>
    <input type="range" id="min-edge" min="0" max="30" step="1" value="5">
  </label>
</nav>

<nav class="filters" id="stats-controls" aria-label="Статистика" hidden>
  <div class="segmented" role="group">
    <button class="segmented__item segmented__item--active" data-stats-sport="tennis">Игроки</button>
    <button class="segmented__item" data-stats-sport="football">Команды</button>
  </div>
  <input type="search" id="stats-search" class="search" placeholder="Поиск по имени" autocomplete="off">
</nav>

<main id="content" class="content" aria-live="polite">
  <p class="muted content__placeholder">Загрузка…</p>
</main>

<footer class="foot">
  <p class="muted" id="foot-note"></p>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
